name: PixelFX checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose checks for changed files
        id: scope
        shell: python
        run: |
          import json, os, pathlib, subprocess
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
          if base and set(base) == {'0'}:
              base = subprocess.check_output(['git', 'merge-base', 'HEAD', 'origin/main'], text=True).strip()
          runtime = True
          if base and set(base) != {'0'}:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              def page_or_document(path):
                  return (path.endswith('.md') or path.startswith(('docs/site/', 'docs/wiki/', 'docs/images/'))
                          or path in {'.github/workflows/pages.yml', '.github/workflows/ci.yml', 'tools/pixelfx/check_site.py'})
              runtime = not paths or any(not page_or_document(path) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('runtime=' + str(runtime).lower() + '\n')
          print('Run Godot regression:' if runtime else 'Run static website and documentation checks only', runtime)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the repository website
        run: |
          python3 tools/pixelfx/check_site.py
          node --check docs/site/app.js
      - name: Install Godot 4.3
        if: steps.scope.outputs.runtime == 'true'
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Check native catalog playback
        if: steps.scope.outputs.runtime == 'true'
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.3-stable_linux.x86_64
        run: python3 tools/pixelfx/basic_check.py
      - name: Check accepted effects and generator regressions
        if: steps.scope.outputs.runtime == 'true'
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.3-stable_linux.x86_64
        run: python3 tools/pixelfx/check.py
      - name: Build release archives
        if: steps.scope.outputs.runtime == 'true'
        run: python3 tools/pixelfx/package_demo.py
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.runtime == 'true'
        with:
          name: validation
          path: |
            builds/pixelfx/*.log
            builds/pixelfx/*.json
            builds/pixelfx/*-actual.png
            builds/pixelfx/*-actual.rgba
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.runtime == 'true'
        with:
          name: release-packages
          path: |
            builds/pixelfx-addon-*.zip
            builds/pixelfx-godot-*.zip
            builds/SHA256SUMS
            builds/pixelfx/release.json
