name: PixelFX checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Godot 4.3
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Validate source, pixels and runtime
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.3-stable_linux.x86_64
        run: python3 tools/pixelfx/check.py
      - name: Build release archives
        run: python3 tools/pixelfx/package_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            builds/pixelfx/*.log
            builds/pixelfx/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            builds/pixelfx-addon-*.zip
            builds/pixelfx-godot-*.zip
            builds/SHA256SUMS
            builds/pixelfx/release.json
